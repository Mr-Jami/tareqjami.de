[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# --- Domain canonicalization -------------------------------------------
# Primary domain: tareqjami.de
# All alias domains (and any www. host) 301-redirect to it.
# force = true is required: the same site is served on every host, so the
# requested path always "exists" in the deploy and the redirect would
# otherwise be skipped.
[[redirects]]
  from = "https://www.tareqjami.de/*"
  to = "https://tareqjami.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://tareqjami.com/*"
  to = "https://tareqjami.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.tareqjami.com/*"
  to = "https://tareqjami.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://jami.cc/*"
  to = "https://tareqjami.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.jami.cc/*"
  to = "https://tareqjami.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://jami-it.de/*"
  to = "https://tareqjami.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.jami-it.de/*"
  to = "https://tareqjami.de/:splat"
  status = 301
  force = true

# --- Short links --------------------------------------------------------
# Memorable paths on the primary domain that forward to external content.
# 302 (not 301) so the target can change later without browsers caching
# the old destination. No `force` needed: these paths don't exist in dist/.
[[redirects]]
  from = "/talks/strong-types"
  to = "https://www.youtube.com/watch?v=xdvYpp-MZf4"
  status = 302

# The CV used to live at /tareq-jami-cv.pdf; it is now built per language
# (npm run cv). Keep the old link working for anyone who bookmarked it.
[[redirects]]
  from = "/tareq-jami-cv.pdf"
  to = "/tareq-jami-cv-en.pdf"
  status = 301

# --- Headers ------------------------------------------------------------
# Security baseline for every response. The CSP is strict because the site
# loads nothing third-party: self-hosted fonts, no analytics, no embeds. The
# only inline script is the pre-paint theme/language init in Base.astro,
# hence 'unsafe-inline' for scripts (a hash would break silently on every
# edit of that script); styles are set from JS by anime.js and success.astro
# uses style attributes, hence 'unsafe-inline' for styles. img-src allows
# data: for the inline SVG favicon; form-action 'self' covers Netlify Forms.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# Astro writes content-hashed bundles (JS, CSS, fonts) to /_astro/, so they
# can be cached forever; a change produces a new file name.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
